name: Build SoftTH FSX Win11 x86

on:
  workflow_dispatch:
  push:
    branches: [ "fsx-win11" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore legacy D3DX package
        shell: cmd
        run: nuget restore make\SoftTH-FSX-Win11.sln -PackagesDirectory packages -NonInteractive

      - name: Build x86 Release
        shell: cmd
        run: msbuild make\SoftTH-FSX-Win11.sln /m /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Package public beta
        shell: pwsh
        run: |
          $name = "SoftTH-v3.47-FSX-SE-Win11-VC-DirectInput-Focus-Test-x86"
          $dir = Join-Path $PWD "dist\$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "docs") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "examples") | Out-Null

          Copy-Item "bin\fsx-win11\x86\Release\d3d9.dll" $dir
          Copy-Item "bin\fsx-win11\x86\Release\D3DX9_43.dll" $dir
          Copy-Item "bin\fsx-win11\x86\Release\D3DCompiler_43.dll" $dir
          Copy-Item "LICENSE" $dir
          Copy-Item "README.md" $dir
          Copy-Item "RELEASE_NOTES_FSX_WIN11.md" $dir
          Copy-Item "docs\FSX-SE-Win11.md" (Join-Path $dir "docs")
          Copy-Item "examples\config.SoftTHconfig.example" (Join-Path $dir "examples")

          Compress-Archive -Path "$dir\*" -DestinationPath "dist\$name.zip" -Force

      - name: Upload public beta package
        uses: actions/upload-artifact@v4
        with:
          name: SoftTH-v3.47-FSX-SE-Win11-VC-DirectInput-Focus-Test-x86
          path: dist/SoftTH-v3.47-FSX-SE-Win11-VC-DirectInput-Focus-Test-x86.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease v3.42 (unchanged)
        if: github.ref == 'refs/heads/fsx-win11'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v3.42" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v3.42 already exists; leaving it unchanged."
            exit 0
          }
          gh release create "v3.42" "dist\SoftTH-v3.47-FSX-SE-Win11-VC-DirectInput-Focus-Test-x86.zip#SoftTH v3.42 FSX-SE Win11 Beta x86" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SoftTH v3.42 FSX-SE / Windows 11 Public Beta" --notes-file "RELEASE_NOTES_FSX_WIN11.md" --prerelease
