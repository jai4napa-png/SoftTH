name: Build SoftTH FSX Win11 x86

on:
  workflow_dispatch:
  push:
    branches: [ "fsx-win11" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply FSX/Win11 source patch
        shell: cmd
        run: git apply patches\fsx-win11-source.patch

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore legacy D3DX package
        shell: cmd
        run: nuget restore make\SoftTH-FSX-Win11.sln -PackagesDirectory packages -NonInteractive

      - name: Build x86 Release
        shell: cmd
        run: msbuild make\SoftTH-FSX-Win11.sln /m /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Upload patched d3d9.dll
        uses: actions/upload-artifact@v4
        with:
          name: SoftTH-FSX-Win11-x86
          path: |
            bin/fsx-win11/x86/Release/d3d9.dll
            bin/fsx-win11/x86/Release/*.pdb
            bin/fsx-win11/x86/Release/D3DX9_43.dll
            bin/fsx-win11/x86/Release/D3DCompiler_43.dll
          if-no-files-found: warn
